services:
  app:
    image: ghcr.io/tomboone/weekly-movie-theater-email:latest
    restart: unless-stopped
    ports:
      # Loopback only. Docker-published ports bypass the host firewall (ufw), so "8000:8000" exposes
      # the app, /trigger included, to the whole LAN. Reach it from the host or over an SSH tunnel.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - MOVIE_STATE_PATH=/app/data/movie_state.json
    volumes:
      - app-data:/app/data

volumes:
  app-data:
