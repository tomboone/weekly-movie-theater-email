[project]
name = "weekly-movie-theater-email"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.58.0",
    "playwright-stealth>=2.0.3,<3",
    "httpx>=0.28.1,<1",
    "fastapi>=0.135.3,<1",
    "uvicorn>=0.34,<1",
    "apscheduler>=3.10,<4",
    "azure-communication-email>=1.1.0,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24,<2",
    "pytest>=8.0,<10",
    "respx>=0.22,<1",
    "pyright>=1.1.408",
    "pytest-cov>=6.0",
    "ruff>=0.15.11",
    "yamllint>=1.38.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
