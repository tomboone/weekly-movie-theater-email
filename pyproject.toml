[project]
name = "weekly-movie-theater-email"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright==1.59.0",
    "playwright-stealth>=2.0.3,<3",
    "httpx>=0.28.1,<1",
    "fastapi>=0.136.1,<1",
    "uvicorn>=0.47.0,<1",
    "apscheduler>=3.11.2,<4",
    "azure-communication-email>=1.1.0,<2",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.0,<3",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0,<2",
    "pytest>=9.0.3,<10",
    "respx>=0.23.1,<1",
    "pyright>=1.1.409",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "yamllint>=1.38.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
