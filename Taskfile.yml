version: "3"

dotenv: [".env"]

tasks:
  build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  up:
    desc: Start the dev container
    deps: [build]
    cmds:
      - docker compose up -d --remove-orphans

  run:
    desc: Run the app
    deps: [up]
    cmds:
      - >-
        docker compose exec app
        uvicorn server:app --host 0.0.0.0 --port 8000

  stop:
    desc: Stop the dev container
    cmds:
      - docker compose stop

  down:
    desc: Remove the dev container
    cmds:
      - docker compose down

  reset:
    desc: Tear down, rebuild, and start fresh
    cmds:
      - docker compose down --rmi local
      - docker compose build
      - docker compose up -d --remove-orphans

  check:
    desc: Run all checks (ruff, pyright, yamllint, pytest)
    deps: [up]
    cmds:
      - >-
        docker compose exec app sh -c
        "ruff check .
        && ruff format --check .
        && pyright
        && yamllint -d relaxed .github/ docker-compose.yml Taskfile.yml
        && pytest tests/ -v -m 'not integration'"

  lint:
    desc: Run ruff check and format
    deps: [up]
    cmds:
      - >-
        docker compose exec app sh -c
        "ruff check . && ruff format --check ."

  lint:fix:
    desc: Auto-fix ruff issues
    deps: [up]
    cmds:
      - >-
        docker compose exec app sh -c
        "ruff check --fix . && ruff format ."

  test:
    desc: Run all tests
    deps: [up]
    cmds:
      - docker compose exec app pytest tests/ -v

  test:unit:
    desc: Run unit tests only (no network)
    deps: [up]
    cmds:
      - >-
        docker compose exec app
        pytest tests/ -v -m 'not integration'

  trigger:
    desc: "Manually trigger (usage: task trigger [-- MM-DD-YYYY])"
    cmds:
      - >-
        curl -X POST
        -H "Authorization: Bearer $TRIGGER_API_KEY"
        "http://localhost:8000/trigger{{if .CLI_ARGS}}?date={{.CLI_ARGS}}{{end}}"

  shell:
    desc: Open a shell in the container
    deps: [up]
    cmds:
      - docker compose exec app bash

  hooks:install:
    desc: Install pre-commit hooks
    cmds:
      - pre-commit install
