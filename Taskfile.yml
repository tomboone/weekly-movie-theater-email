version: "3"

dotenv: [".env"]

vars:
  INFRA_DIR: ../tbc-localdev-infra

tasks:
  infra:up:
    desc: Start infrastructure containers (traefik, etc.)
    cmd: task --dir {{.INFRA_DIR}} up

  infra:down:
    desc: Stop infrastructure containers
    cmd: task --dir {{.INFRA_DIR}} down

  infra:status:
    desc: Show infrastructure container status
    cmd: task --dir {{.INFRA_DIR}} status

  build:
    desc: Build the Docker image
    cmds:
      - docker compose build

  up:
    desc: Start the dev container
    deps: [infra:up, build]
    cmds:
      - docker compose up -d --remove-orphans

  run:
    desc: Run the app
    deps: [up]
    cmds:
      - >-
        docker compose exec app
        uvicorn server:app --host 0.0.0.0 --port 8000

  stop:
    desc: Stop the dev container
    cmds:
      - docker compose stop

  down:
    desc: Remove the dev container
    cmds:
      - docker compose down

  reset:
    desc: Tear down, rebuild, and start fresh
    cmds:
      - docker compose down --rmi local
      - docker compose build
      - docker compose up -d --remove-orphans

  check:
    desc: Run all checks (ruff, pyright, yamllint, pytest)
    cmds:
      - >-
        docker compose exec -T app sh -c
        "ruff check .
        && ruff format --check .
        && pyright
        && yamllint -d relaxed .github/ docker-compose.yml Taskfile.yml
        && pytest tests/unit/ -v"

  lint:
    desc: Run ruff check
    cmds:
      - docker compose exec -T app ruff check .

  lint:fix:
    desc: Auto-fix ruff issues
    cmds:
      - docker compose exec -T app ruff check --fix .

  typecheck:
    desc: Run pyright type checker
    cmds:
      - docker compose exec -T app pyright

  yamllint:
    desc: Lint YAML files
    cmds:
      - docker compose exec -T app yamllint -d relaxed .github/ docker-compose.yml Taskfile.yml

  format:
    desc: Check code formatting
    cmds:
      - docker compose exec -T app ruff format --check .

  format:fix:
    desc: Auto-format code
    cmds:
      - docker compose exec -T app ruff format .

  test:
    desc: Run unit tests
    cmds:
      - docker compose exec -T app pytest tests/unit/ -v

  test:integration:
    desc: Run integration tests (requires network + Playwright)
    cmds:
      - docker compose exec -T app pytest tests/integration/ -v

  test:all:
    desc: Run all tests
    cmds:
      - docker compose exec -T app pytest tests/ -v

  trigger:
    desc: "Manually trigger (usage: task trigger [-- MM-DD-YYYY])"
    cmds:
      - >-
        curl -X POST
        -H "Authorization: Bearer $TRIGGER_API_KEY"
        "https://movie-email.localhost/trigger{{if .CLI_ARGS}}?date={{.CLI_ARGS}}{{end}}"

  shell:
    desc: Open a shell in the container
    cmds:
      - docker compose exec app bash

  hooks:install:
    desc: Install pre-commit hooks
    cmds:
      - pre-commit install
