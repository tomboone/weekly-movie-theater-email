name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "scraper/**"
      - "enrichment/**"
      - "email_sender/**"
      - "infra/**"
      - "Dockerfile"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build
    env:
      TF_VAR_tmdb_api_key: ${{ secrets.TF_VAR_TMDB_API_KEY }}
      TF_VAR_email_from: ${{ secrets.TF_VAR_EMAIL_FROM }}
      TF_VAR_email_to: ${{ secrets.TF_VAR_EMAIL_TO }}
      TF_VAR_trigger_api_key: ${{ secrets.TF_VAR_TRIGGER_API_KEY }}
      TF_VAR_ghcr_image: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init -backend-config=backend.hcl

      - name: OpenTofu Format Check
        working-directory: infra
        run: tofu fmt -check

      - name: OpenTofu Validate
        working-directory: infra
        run: tofu validate

      - name: OpenTofu Plan
        working-directory: infra
        run: tofu plan -no-color -out=tfplan

      - name: OpenTofu Apply
        if: github.ref == 'refs/heads/main'
        working-directory: infra
        run: tofu apply -auto-approve tfplan
