services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - MOVIE_STATE_PATH=/app/data/movie_state.json
    volumes:
      - .:/app
      - ./data:/app/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.movie-email.rule=Host(`movie-email.localhost`)"
      - "traefik.http.routers.movie-email.tls=true"
      - "traefik.http.routers.movie-email.entrypoints=websecure"
      - "traefik.http.services.movie-email.loadbalancer.server.port=8000"
    command: >-
      sh -c "uv pip install --system --quiet --group dev
      && sleep infinity"

networks:
  proxy:
    external: true
