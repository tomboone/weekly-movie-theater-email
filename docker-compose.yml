services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - MOVIE_STATE_PATH=/app/data/movie_state.json
    volumes:
      - .:/app
      - ./data:/app/data
    command: >-
      sh -c "uv pip install --system --quiet --group dev
      && sleep infinity"
